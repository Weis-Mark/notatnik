<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content">
<title>Notatnik</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notatnik">
<meta name="theme-color" content="#1b1b21">
<style>
:root{
  --bg:#f6f6f8;--panel:#ffffff;--panel2:#efeff3;--text:#1d1d22;--muted:#6b6b76;--line:#dcdce3;
  --accent:#7c3aed;--accent-soft:#ede5ff;--mark:#ffe36e;--danger:#c62828;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121216;--panel:#1b1b21;--panel2:#24242c;--text:#e9e9ee;--muted:#9a9aa6;--line:#30303a;
    --accent:#a78bfa;--accent-soft:#2e2440;--mark:#7a6200;--danger:#ef5350;
  }
}
:root[data-theme="dark"]{
  --bg:#121216;--panel:#1b1b21;--panel2:#24242c;--text:#e9e9ee;--muted:#9a9aa6;--line:#30303a;
  --accent:#a78bfa;--accent-soft:#2e2440;--mark:#7a6200;--danger:#ef5350;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
main{padding-bottom:env(safe-area-inset-bottom)}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button{font:inherit;color:inherit;background:transparent;border:1px solid transparent;border-radius:8px;padding:5px 9px;cursor:pointer;min-width:34px;min-height:34px}
button:hover{background:var(--panel2)}
input,select{font:inherit;color:var(--text);background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:7px 10px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.hidden{display:none!important}
.muted{color:var(--muted)}
header{display:flex;gap:8px;align-items:center;padding:calc(8px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 8px calc(12px + env(safe-area-inset-left));background:var(--panel);border-bottom:1px solid var(--line)}
.brand{font-weight:700;white-space:nowrap}
.search{flex:1;display:flex;min-width:0}
.search input{flex:1}
main{flex:1;display:flex;min-height:0;position:relative}
.pane{position:relative;display:flex;flex-direction:column;min-height:0;min-width:0;border-right:1px solid var(--line);background:var(--panel)}
#secPane{width:210px;flex:none}
#pagePane{width:240px;flex:none;background:var(--panel2)}
#editorPane{flex:1;background:var(--bg);border-right:0}
.paneHead{display:flex;align-items:center;gap:4px;padding:8px;border-bottom:1px solid var(--line);min-height:51px}
.paneHead select{flex:1}
.list{flex:1;overflow:auto;padding:4px}
@media (pointer:coarse),(max-width:699px){.list{padding-bottom:130px}}
.item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;cursor:pointer;user-select:none}
.item:hover{background:var(--panel2)}
#pagePane .item:hover{background:var(--panel)}
.item.active{background:var(--accent-soft);font-weight:600}
.dot{width:6px;align-self:stretch;border-radius:3px;min-height:20px;flex:none}
.name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.more{visibility:hidden;min-height:28px;padding:0 6px}
.item.active .more,.item:hover .more{visibility:visible}
@media (hover:none){.more{visibility:visible}}
.pitem{flex-direction:column;align-items:stretch;gap:0;position:relative;padding-right:40px}
.pitem .more{position:absolute;right:4px;top:50%;transform:translateY(-50%)}
.item.pressed{background:var(--accent);color:#fff}
.pitem small{color:var(--muted);font-weight:400;font-size:11.5px}
.addrow{margin:6px;border:1px dashed var(--line)}
.back{display:none}
#syncBtn.err{color:#e5484d}
#syncBtn.spin{animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.imgview{position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;overflow:auto;cursor:zoom-out}
.imgview img{max-width:100%;max-height:100%;object-fit:contain}
#body img{cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px 14px;z-index:99;box-shadow:0 4px 16px rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:opacity .25s}
#toast.on{opacity:1}
.fs{position:absolute;right:0;width:40px;pointer-events:none;z-index:5;display:none}
.fs-thumb{position:absolute;left:6px;right:2px;min-height:64px;border-radius:14px;background:var(--accent);opacity:.5;pointer-events:auto;touch-action:none}
.fs-jump{position:absolute;right:48px;bottom:12px;display:flex;flex-direction:column;gap:8px;pointer-events:auto}
.fs-jump button{width:44px;height:44px;border-radius:50%;padding:0;font-size:20px;background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px rgba(0,0,0,.25);opacity:.9}
.fs.drag .fs-thumb{opacity:.85}
@media (min-width:700px){body.focus #secPane,body.focus #pagePane{display:none}}
body.focus #results{left:0;border-left:0}
body.focus #body{max-width:none;padding-left:32px;padding-right:32px}
body.focus #title{padding-left:32px;padding-right:32px}
body.focus #meta{padding-left:32px;padding-right:32px}
#focusBtn.on{background:var(--accent-soft)}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:6px 8px;border-bottom:1px solid var(--line);background:var(--panel);min-height:51px}
.sp{flex:1}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--line)}
.toolbar svg{display:block;margin:auto}
.toolbar button.on{background:var(--accent-soft)}
#floatbar{position:fixed;z-index:40;display:flex;align-items:center;gap:1px;padding:3px;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#floatbar button{min-width:30px;min-height:30px;padding:3px 6px}
#floatbar svg{display:block;margin:auto}
#floatbar .sep{width:1px;align-self:stretch;margin:4px 3px;background:var(--line)}
.toolbar button:disabled{opacity:.35;cursor:default;background:transparent}
#status{font-size:12px;color:var(--muted);padding:0 6px}
.scroll{flex:1;overflow:auto}
#title{display:block;width:100%;font-size:22px;font-weight:700;border:0;background:transparent;padding:16px 20px 2px;border-radius:0}
#title:focus{outline:none}
#meta{padding:0 20px;color:var(--muted);font-size:12px}
#body{font-size:calc(1em * var(--fs,1));padding:12px 20px 80px;outline:none;max-width:920px;min-height:60%}
#body:empty:before{content:"Zacznij pisać…";color:var(--muted)}
#body p{margin:0 0 .45em}
#body h2{font-size:1.25em;margin:.8em 0 .35em}
#body table{border-collapse:collapse;margin:.5em 0}
#body td{border:1px solid var(--line);padding:4px 8px;vertical-align:top}
#body td p{margin:0}
#body ul,#body ol{margin:.2em 0 .5em;padding-left:1.6em}
#body a{color:var(--accent)}
#body img{max-width:100%;height:auto;display:inline-block;vertical-align:bottom;border-radius:3px}
#body .ph{color:var(--muted);font-size:.9em}
.empty{padding:28px 20px;color:var(--muted);text-align:center}
.locked{padding:30px 16px;text-align:center;color:var(--muted)}
.locked button{margin-top:10px;border:1px solid var(--line);background:var(--panel)}
#results{position:absolute;top:0;bottom:0;right:0;left:210px;background:var(--bg);z-index:20;display:flex;flex-direction:column;border-left:1px solid var(--line)}
.resHead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border-radius:0;min-height:32px;padding:4px 10px;font-size:13.5px}
.seg button.on{background:var(--accent);color:#fff}
.chk{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:5px;cursor:pointer}
#resClose{margin-left:auto}
#resInfo{padding:6px 14px;font-size:12.5px}
.hit{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.hit:hover{background:var(--panel)}
.ht{font-weight:600}
.hp{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.hp .dot{width:10px;height:10px;min-height:0;align-self:center}
.hs{font-size:13.5px;margin-top:2px;opacity:.88}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
::highlight(hit){background-color:#ffd33d;color:#000}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;width:min(420px,100%);max-height:90vh;overflow:auto}
.box h3{margin:0 0 12px;font-size:17px}
.box label{display:block;margin-bottom:10px;font-size:13.5px;color:var(--muted)}
.box label input{display:block;width:100%;margin-top:4px}
.note{font-size:13px;color:var(--muted)}
.btns{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
.primary{background:var(--accent);color:#fff}
.primary:hover{background:var(--accent);filter:brightness(1.1)}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:10px 12px}
.opt.danger{color:var(--danger)}
.opts.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
.opts.grid .opt{justify-content:center}
.sw{display:inline-block;width:24px;height:24px;border-radius:6px;flex:none}
@media (max-width:699px){
  header .brand{display:none}
  #secPane,#pagePane,#editorPane{width:100%;border-right:0}
  body[data-view="sections"] #pagePane,body[data-view="sections"] #editorPane{display:none}
  body[data-view="pages"] #secPane,body[data-view="pages"] #editorPane{display:none}
  body[data-view="editor"] #secPane,body[data-view="editor"] #pagePane{display:none}
  .back{display:inline-block}
  #focusBtn{display:none}
  .toolbar{flex-wrap:wrap;row-gap:2px}
  .toolbar .sp{display:none}
  .toolbar::-webkit-scrollbar{display:none}
  .toolbar button{flex:none}
  #status{display:none}
  #results{left:0;border-left:0}
  #title{padding:12px 14px 2px}
  #meta{padding:0 14px}
  #body{padding:10px 14px 80px}
}
</style>
</head>
<body data-view="sections">
<header>
  <span class="brand">📝 Notatnik</span>
  <div class="search"><input id="q" type="search" placeholder="Szukaj…  (Ctrl+F)" autocomplete="off"></div>
  <button id="syncBtn" class="hidden" title="Synchronizacja z serwerem">⇅</button>
  <button id="softRef" title="Odśwież widok (działa bez internetu)">↺</button>
  <button id="hardRef" title="Pełne odświeżenie – pobierz najnowszą wersję (wymaga internetu)">🔄</button>
  <button id="appMore" title="Ustawienia">⚙</button>
</header>
<main>
  <section id="secPane" class="pane">
    <div class="paneHead"><select id="nbSel" title="Notes"></select><button id="nbMore" title="Notes – opcje">⋯</button></div>
    <div id="secList" class="list"></div>
    <button id="addSec" class="addrow">＋ Nowa zakładka</button>
  </section>
  <section id="pagePane" class="pane">
    <div class="paneHead">
      <button class="back" data-back="sections" title="Wstecz">‹</button>
      <span class="dot" id="secDot"></span><b id="secName" class="name"></b>
      <button id="lockBtn" title="Zablokuj zakładkę" class="hidden">🔒</button>
      <button id="addPage" title="Nowa strona">＋</button>
    </div>
    <div id="pageList" class="list"></div>
  </section>
  <section id="editorPane" class="pane">
    <div class="toolbar">
      <button class="back" data-back="pages" title="Wstecz">‹</button>
      <button id="focusBtn" title="Pełny widok strony (Ctrl+\)">⤢</button>
      <button id="undoBtn" title="Cofnij (Ctrl+Z)">↶</button>
      <button id="redoBtn" title="Ponów (Ctrl+Y)">↷</button>
      <span class="sep"></span>
      <button data-cmd="bold" title="Pogrubienie (Ctrl+B)"><b>B</b></button>
      <button data-cmd="italic" title="Kursywa (Ctrl+I)"><i>I</i></button>
      <button data-cmd="underline" title="Podkreślenie (Ctrl+U)"><u>U</u></button>
      <button data-cmd="strikeThrough" title="Przekreślenie"><s>S</s></button>
      <button data-cmd="h2" title="Nagłówek">H</button>
      <button data-cmd="insertUnorderedList" title="Lista punktowana">•</button>
      <button data-cmd="insertOrderedList" title="Lista numerowana">1.</button>
      <button data-cmd="selectStep" title="Zaznacz: raz akapit, drugi raz całą stronę (Ctrl+A)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"><rect x="2" y="2.5" width="12" height="11" rx="1.5"/></svg></button>
      <button id="imgBtn" title="Wstaw obrazek (możesz też wkleić Ctrl+V)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="1.8" y="2.8" width="12.4" height="10.4" rx="1.5"/><circle cx="5.5" cy="6.3" r="1.2"/><path d="M2.2 12.2l3.8-3.6 2.6 2.4 2.1-1.9 3.2 3"/></svg></button><input type="file" id="imgPick" accept="image/*" multiple hidden>
      <span class="sep"></span>
      <button data-cmd="justifyLeft" title="Wyrównaj do lewej"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="3" x2="14" y2="3"/><line x1="2" y1="6.3" x2="10" y2="6.3"/><line x1="2" y1="9.6" x2="14" y2="9.6"/><line x1="2" y1="12.9" x2="10" y2="12.9"/></svg></button>
      <button data-cmd="justifyCenter" title="Wyśrodkuj"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="3" x2="14" y2="3"/><line x1="4" y1="6.3" x2="12" y2="6.3"/><line x1="2" y1="9.6" x2="14" y2="9.6"/><line x1="4" y1="12.9" x2="12" y2="12.9"/></svg></button>
      <button data-cmd="justifyRight" title="Wyrównaj do prawej"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="3" x2="14" y2="3"/><line x1="6" y1="6.3" x2="14" y2="6.3"/><line x1="2" y1="9.6" x2="14" y2="9.6"/><line x1="6" y1="12.9" x2="14" y2="12.9"/></svg></button>
      <button data-cmd="justifyFull" title="Wyjustuj (do obu krawędzi)"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="3" x2="14" y2="3"/><line x1="2" y1="6.3" x2="14" y2="6.3"/><line x1="2" y1="9.6" x2="14" y2="9.6"/><line x1="2" y1="12.9" x2="14" y2="12.9"/></svg></button>
      <span class="sep"></span>
      <button data-cmd="removeFormat" title="Usuń formatowanie">⌫</button>
      <span class="sp"></span><span id="status"></span>
      <button id="pageMore" title="Strona – opcje">⋯</button>
    </div>
    <div id="noPage" class="empty">Wybierz stronę z listy albo dodaj nową (＋).</div>
    <div id="doc" class="scroll hidden">
      <input id="title" placeholder="Tytuł strony" autocomplete="off">
      <div id="meta"></div>
      <div id="body" contenteditable="true" spellcheck="true"></div>
    </div>
  </section>
  <div id="results" class="hidden">
    <div class="resHead">
      <div id="scopes" class="seg">
        <button data-s="page">Ta strona</button><button data-s="sec">Ta zakładka</button><button data-s="nb">Ten notes</button><button data-s="all">Wszystko</button>
      </div>
      <label class="chk"><input type="checkbox" id="loose"> bez ogonków (ą=a, ø=o)</label>
      <button id="resClose" title="Zamknij (Esc)">✕</button>
    </div>
    <div id="resInfo" class="muted"></div>
    <div id="resList" class="list"></div>
  </div>
</main>
<div id="floatbar" class="hidden">
  <button data-cmd="bold" title="Pogrubienie"><b>B</b></button><button data-cmd="italic" title="Kursywa"><i>I</i></button><button data-cmd="underline" title="Podkreślenie"><u>U</u></button><button data-cmd="strikeThrough" title="Przekreślenie"><s>S</s></button><button data-cmd="h2" title="Nagłówek">H</button><button data-cmd="insertUnorderedList" title="Lista">•</button><span class="sep"></span><button data-cmd="justifyLeft" title="Do lewej"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="3" x2="14" y2="3"/><line x1="2" y1="6.3" x2="10" y2="6.3"/><line x1="2" y1="9.6" x2="14" y2="9.6"/><line x1="2" y1="12.9" x2="10" y2="12.9"/></svg></button><button data-cmd="justifyCenter" title="Do środka"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="3" x2="14" y2="3"/><line x1="4" y1="6.3" x2="12" y2="6.3"/><line x1="2" y1="9.6" x2="14" y2="9.6"/><line x1="4" y1="12.9" x2="12" y2="12.9"/></svg></button><button data-cmd="justifyRight" title="Do prawej"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="3" x2="14" y2="3"/><line x1="6" y1="6.3" x2="14" y2="6.3"/><line x1="2" y1="9.6" x2="14" y2="9.6"/><line x1="6" y1="12.9" x2="14" y2="12.9"/></svg></button><button data-cmd="justifyFull" title="Wyjustuj"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><line x1="2" y1="3" x2="14" y2="3"/><line x1="2" y1="6.3" x2="14" y2="6.3"/><line x1="2" y1="9.6" x2="14" y2="9.6"/><line x1="2" y1="12.9" x2="14" y2="12.9"/></svg></button><span class="sep"></span><button data-cmd="removeFormat" title="Usuń formatowanie">⌫</button>
</div>
<div id="modal" class="modal hidden"></div>
<input type="file" id="file" accept=".json,application/json" class="hidden">
<script>
"use strict";
const $=s=>document.querySelector(s);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const COLORS=["#e5484d","#f76b15","#d4a017","#30a46c","#12a594","#0090ff","#3e63dd","#8e4ec6","#d6409f","#8d8d8d","#a18072","#5b8c00"];
const KEY="notatki.v1", SKEY="notatki.settings";

/* ---------- ustawienia ---------- */
let settings={};
try{settings=JSON.parse(localStorage.getItem(SKEY))||{}}catch(e){}
if(!settings.scope)settings.scope="sec";
if(settings.loose===undefined)settings.loose=true;
if(!settings.theme)settings.theme="auto";
if(!settings.fs)settings.fs=1;
function fsStep(d){const L=[0.75,0.85,0.9,1,1.15,1.3,1.5,1.75,2];let i=L.indexOf(settings.fs);if(i<0)i=3;
  settings.fs=L[Math.max(0,Math.min(L.length-1,i+d))];saveSettings();applyFs();appMenu();}
function applyFs(){document.documentElement.style.setProperty("--fs",settings.fs);}
function applyFocus(){
  document.body.classList.toggle("focus",!!settings.focus);
  const b=document.getElementById("focusBtn");
  if(b){b.classList.toggle("on",!!settings.focus);b.textContent=settings.focus?"⤡":"⤢";b.title=settings.focus?"Pokaż kolumny (Ctrl+\\)":"Pełny widok strony (Ctrl+\\)";}
}
function toggleFocus(v){settings.focus=v===undefined?!settings.focus:v;saveSettings();applyFocus();}
function saveSettings(){try{localStorage.setItem(SKEY,JSON.stringify(settings))}catch(e){}}
function applyTheme(){const r=document.documentElement;if(settings.theme==="auto")delete r.dataset.theme;else r.dataset.theme=settings.theme;
  const dark=settings.theme==="dark"||(settings.theme==="auto"&&matchMedia("(prefers-color-scheme: dark)").matches);
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.content=dark?"#1b1b21":"#ffffff";}

/* ---------- dane ---------- */
let state=null;
let mem={unlocked:{},dirtyEnc:new Set()};
const ui={nb:null,sec:null,page:null};

function demo(){
  const p=(t,h)=>({id:uid(),title:t,html:h,updated:Date.now()});

/* ---------- baza danych (IndexedDB – duża pojemność) ---------- */
let db=null;           // null => tryb awaryjny (localStorage)
const dirtySecs=new Set(), delSecs=new Set();
function idbOpen(){
  return new Promise((res,rej)=>{
    let rq;try{rq=indexedDB.open("notatki",1);}catch(e){rej(e);return;}
    rq.onupgradeneeded=()=>rq.result.createObjectStore("kv");
    rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);
  });
}
function idbAll(){
  return new Promise((res,rej)=>{
    const t=db.transaction("kv","readonly"),st=t.objectStore("kv"),out={};
    const rq=st.openCursor();
    rq.onsuccess=()=>{const c=rq.result;if(c){out[c.key]=c.value;c.continue();}else res(out);};
    rq.onerror=()=>rej(rq.error);
  });
}
function idbWrite(puts,dels){
  return new Promise((res,rej)=>{
    const t=db.transaction("kv","readwrite"),st=t.objectStore("kv");
    for(const [k,v] of puts)st.put(v,k);
    for(const k of dels)st.delete(k);
    t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error("Zapis przerwany"));
  });
}
function idbClear(){return new Promise((res,rej)=>{const t=db.transaction("kv","readwrite");t.objectStore("kv").clear();t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}
function metaOf(){
  return {version:2,ui:{nb:ui.nb,sec:ui.sec,page:ui.page},notebooks:state.notebooks.map(n=>({id:n.id,name:n.name,sections:n.sections.map(s=>({id:s.id,name:s.name,color:s.color,isEnc:!!s.enc}))}))};
}
function markAllDirty(){state.notebooks.forEach(n=>n.sections.forEach(s=>dirtySecs.add(s.id)));}
async function load(){
  try{db=await idbOpen();}catch(e){db=null;}
  if(db){
    const all=await idbAll();
    if(all.sync)sy=Object.assign(sy,all.sync);
    if(all.meta){
      state={version:2,notebooks:all.meta.notebooks.map(n=>({id:n.id,name:n.name,sections:n.sections.map(s=>{
        const r=all["sec:"+s.id]||{};return {id:s.id,name:s.name,color:s.color,enc:r.enc||null,pages:r.enc?null:(r.pages||[])};
      })}))};
      Object.assign(ui,all.meta.ui||{});
      return;
    }
    // pierwsze uruchomienie: przenieś ewentualne dane z wersji testowej
    try{const raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw);}catch(e){}
    if(!state||!Array.isArray(state.notebooks)||!state.notebooks.length)state=demo();
    Object.assign(ui,state.ui||{});
    markAllDirty();await doSave();
    try{localStorage.removeItem(KEY);}catch(e){}
    return;
  }
  try{const raw=localStorage.getItem(KEY);if(raw)state=JSON.parse(raw);}catch(e){}
  if(!state||!Array.isArray(state.notebooks)||!state.notebooks.length)state=demo();
  Object.assign(ui,state.ui||{});
  setTimeout(()=>alert("Uwaga: ta przeglądarka nie pozwala tu na dużą bazę danych – działa tryb awaryjny o małej pojemności (kilka MB). Otwórz aplikację w Edge lub Chrome albo z adresu na GitHubie."),300);
}
const curNb=()=>state.notebooks.find(n=>n.id===ui.nb)||state.notebooks[0];
const curSec=()=>{const nb=curNb();return nb?nb.sections.find(s=>s.id===ui.sec):null;};
function pagesOf(sec){if(!sec)return null;if(sec.enc){const u=mem.unlocked[sec.id];return u?u.pages:null;}return sec.pages||(sec.pages=[]);}
function curPage(){const ps=pagesOf(curSec());return ps?ps.find(p=>p.id===ui.page):null;}
function findSec(id){for(const nb of state.notebooks)for(const s of nb.sections)if(s.id===id)return s;return null;}
function fixUi(){
  const nb=curNb();ui.nb=nb.id;
  if(!nb.sections.find(s=>s.id===ui.sec))ui.sec=nb.sections[0]?nb.sections[0].id:null;
  const ps=pagesOf(curSec());
  if(!ps||!ps.find(p=>p.id===ui.page))ui.page=null;
}

/* ---------- zapis ---------- */
let saveT=null;
function setStatus(t){$("#status").textContent=t;}
function save(){clearTimeout(saveT);setStatus("…");saveT=setTimeout(doSave,400);}
function touch(sec){if(sec){if(sec.enc)mem.dirtyEnc.add(sec.id);dirtySecs.add(sec.id);}save();}
let saving=null;
async function doSave(){
  clearTimeout(saveT);saveT=null;
  if(saving){await saving;}           // nie nakładaj zapisów na siebie
  saving=(async()=>{
    const keepS=[...dirtySecs],keepD=[...delSecs];
    try{
      for(const id of [...mem.dirtyEnc]){
        const sec=findSec(id),u=mem.unlocked[id];
        if(sec&&u&&sec.enc){sec.enc=await encryptPages(u.key,u.salt,u.pages);dirtySecs.add(id);}
        mem.dirtyEnc.delete(id);
      }
      if(db){
        const puts=[["meta",metaOf()]];
        for(const id of [...dirtySecs]){const s=findSec(id);if(s)puts.push(["sec:"+id,s.enc?{enc:s.enc}:{pages:s.pages||[]}]);}
        const dels=[...delSecs].map(id=>"sec:"+id);
        dirtySecs.clear();delSecs.clear();
        syTrack(puts,dels);
        await idbWrite(puts,dels);
      }else{
        state.ui={nb:ui.nb,sec:ui.sec,page:ui.page};
        localStorage.setItem(KEY,JSON.stringify(state));
      }
      setStatus("Zapisano");
    }catch(e){
      keepS.forEach(id=>dirtySecs.add(id));keepD.forEach(id=>delSecs.add(id));
      setStatus("Błąd zapisu!");alert("Nie udało się zapisać notatek: "+e.message);
    }
  })();
  await saving;saving=null;
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&(saveT||mem.dirtyEnc.size))doSave();});
window.addEventListener("pagehide",()=>{if(saveT||mem.dirtyEnc.size)doSave();});

/* ---------- szyfrowanie ---------- */
const TE=new TextEncoder(),TD=new TextDecoder();
function b64(buf){const b=new Uint8Array(buf);let s="";for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s);}
function unb64(s){const bin=atob(s),b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return b;}
async function deriveKey(pw,salt){
  const base=await crypto.subtle.importKey("raw",TE.encode(pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:250000,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function encryptPages(key,salt,pages){
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},key,TE.encode(JSON.stringify(pages)));
  return {salt:b64(salt),iv:b64(iv),data:b64(ct)};
}
async function decryptPages(pw,e){
  const salt=unb64(e.salt),key=await deriveKey(pw,salt);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(e.iv)},key,unb64(e.data));
  return {key,salt,pages:JSON.parse(TD.decode(pt))};
}
async function setPassword(sec){
  const r=await form((sec.enc?"Nowe hasło":"Ustaw hasło")+" – „"+sec.name+"”",
    [{k:"a",label:"Hasło",type:"password"},{k:"b",label:"Powtórz hasło",type:"password"}],
    "Uwaga: zapomnianego hasła NIE da się odzyskać – notatki z tej zakładki przepadną. Zapisz hasło w mSecure.");
  if(!r)return;
  if(!r.a){alert("Hasło nie może być puste.");return;}
  if(r.a!==r.b){alert("Hasła się różnią.");return;}
  const pages=pagesOf(sec)||[];
  const salt=crypto.getRandomValues(new Uint8Array(16)),key=await deriveKey(r.a,salt);
  sec.enc=await encryptPages(key,salt,pages);sec.pages=null;
  mem.unlocked[sec.id]={key,salt,pages};mem.dirtyEnc.delete(sec.id);dirtySecs.add(sec.id);
  save();render();
}
async function unlock(sec){
  const r=await form("Zakładka „"+sec.name+"” jest chroniona",[{k:"pw",label:"Hasło",type:"password",ac:"current-password"}]);
  if(!r)return false;
  try{mem.unlocked[sec.id]=await decryptPages(r.pw,sec.enc);return true;}
  catch(e){alert("Nieprawidłowe hasło.");return false;}
}
async function lockSec(sec){await doSave();delete mem.unlocked[sec.id];fixUi();render();}
async function lockAll(){await doSave();mem.unlocked={};fixUi();render();}
function removePassword(sec){
  const u=mem.unlocked[sec.id];if(!u)return;
  if(!confirm("Usunąć hasło z zakładki „"+sec.name+"”? Jej treść nie będzie już szyfrowana."))return;
  sec.pages=u.pages;sec.enc=null;delete mem.unlocked[sec.id];mem.dirtyEnc.delete(sec.id);dirtySecs.add(sec.id);
  save();render();
}

/* ---------- okna dialogowe ---------- */
function closeModal(){const m=$("#modal");m.classList.add("hidden");m.innerHTML="";m.onclick=null;}
function form(title,fields,note){
  return new Promise(res=>{
    const m=$("#modal");
    m.innerHTML=`<form class="box"><h3>${esc(title)}</h3>${fields.map(f=>`<label>${esc(f.label)}<input name="${f.k}" type="${f.type||"text"}" value="${esc(f.value||"")}" autocomplete="${f.ac||(f.type==="password"?"new-password":"off")}"></label>`).join("")}${note?`<p class="note">${esc(note)}</p>`:""}<div class="btns"><button type="button" data-c>Anuluj</button><button class="primary">OK</button></div></form>`;
    m.classList.remove("hidden");
    const fm=m.querySelector("form");
    const done=v=>{closeModal();res(v);};
    fm.onsubmit=e=>{e.preventDefault();const o={};fields.forEach(f=>o[f.k]=fm.elements[f.k].value);done(o);};
    fm.querySelector("[data-c]").onclick=()=>done(null);
    m.onclick=e=>{if(e.target===m)done(null);};
    const first=fm.querySelector("input");if(first){first.focus();first.select();}
  });
}
function menu(title,opts,grid){
  const m=$("#modal");
  m.innerHTML=`<div class="box"><h3>${esc(title)}</h3><div class="opts${grid?" grid":""}"></div><div class="btns"><button data-c>Zamknij</button></div></div>`;
  const o=m.querySelector(".opts");
  opts.forEach(op=>{const b=document.createElement("button");b.className="opt"+(op.danger?" danger":"");b.innerHTML=op.html||esc(op.label);b.onclick=()=>{closeModal();if(op.fn)op.fn();};o.append(b);});
  m.querySelector("[data-c]").onclick=closeModal;
  m.onclick=e=>{if(e.target===m)closeModal();};
  m.classList.remove("hidden");
}
const move=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return;[arr[i],arr[j]]=[arr[j],arr[i]];};

/* ---------- widok ---------- */
function revealActive(){
  ["#secList","#pageList"].forEach(q=>{
    const box=$(q),a=box&&box.querySelector(".item.active");
    if(!a||!box.clientHeight)return;
    const br=box.getBoundingClientRect(),ar=a.getBoundingClientRect();
    if(ar.top<br.top||ar.bottom>br.bottom)box.scrollTop+=ar.top-br.top-(box.clientHeight-ar.height)/2;
  });
}
function setView(v){document.body.dataset.view=v;requestAnimationFrame(()=>{revealActive();if(typeof fsUpdate==="function")fsUpdate();});}
function remember(){
  if(!settings.lastSec)settings.lastSec={};if(!settings.lastPage)settings.lastPage={};
  let ch=false;
  if(ui.nb&&ui.sec&&settings.lastSec[ui.nb]!==ui.sec){settings.lastSec[ui.nb]=ui.sec;ch=true;}
  if(ui.sec&&ui.page&&settings.lastPage[ui.sec]!==ui.page){settings.lastPage[ui.sec]=ui.page;ch=true;}
  if(ch)saveSettings();
}
function render(){fixUi();remember();renderNb();renderSecs();renderPages();renderEditor();if(typeof fsUpdate==="function")requestAnimationFrame(fsUpdate);}
function renderNb(){
  const sel=$("#nbSel");
  sel.innerHTML=state.notebooks.map(n=>`<option value="${n.id}">${esc(n.name)}</option>`).join("")+`<option value="__new">＋ Nowy notes…</option>`;
  sel.value=ui.nb;
}
/* przytrzymanie palcem (albo prawy przycisk myszy) otwiera menu */
function longPress(el,fn){
  let t=null,x=0,y=0,fired=false;
  const stop=()=>{clearTimeout(t);t=null;el.classList.remove("pressed");};
  el.addEventListener("pointerdown",e=>{if(e.button>0)return;fired=false;x=e.clientX;y=e.clientY;
    t=setTimeout(()=>{fired=true;el.classList.remove("pressed");if(navigator.vibrate)navigator.vibrate(30);fn();},550);
    setTimeout(()=>{if(t)el.classList.add("pressed");},250);});
  el.addEventListener("pointermove",e=>{if(t&&(Math.abs(e.clientX-x)>10||Math.abs(e.clientY-y)>10))stop();});
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>el.addEventListener(ev,stop));
  el.addEventListener("click",e=>{if(fired){e.stopImmediatePropagation();e.preventDefault();fired=false;}},true);
  el.addEventListener("contextmenu",e=>{e.preventDefault();if(!fired){stop();fn();}});
}
function renderSecs(){
  const box=$("#secList");box.innerHTML="";
  curNb().sections.forEach(sec=>{
    const d=document.createElement("div");
    d.className="item"+(sec.id===ui.sec?" active":"");
    const lock=sec.enc?(mem.unlocked[sec.id]?"🔓":"🔒"):"";
    d.innerHTML=`<span class="dot" style="background:${sec.color}"></span><span class="name">${esc(sec.name)}</span><span>${lock}</span><button class="more" title="Opcje">⋯</button>`;
    d.onclick=()=>openSection(sec.id);
    d.querySelector(".more").onclick=e=>{e.stopPropagation();secMenu(sec);};
    longPress(d,()=>secMenu(sec));
    box.append(d);
  });
  if(!curNb().sections.length)box.innerHTML=`<div class="empty">Brak zakładek.</div>`;
}
function renderPages(){
  const sec=curSec(),box=$("#pageList");box.innerHTML="";
  $("#secName").textContent=sec?sec.name:"";
  $("#secDot").style.background=sec?sec.color:"transparent";
  $("#lockBtn").classList.toggle("hidden",!(sec&&sec.enc&&mem.unlocked[sec.id]));
  $("#addPage").classList.toggle("hidden",!sec||!pagesOf(sec));
  if(!sec){box.innerHTML=`<div class="empty">Dodaj najpierw zakładkę.</div>`;return;}
  const ps=pagesOf(sec);
  if(!ps){
    box.innerHTML=`<div class="locked">🔒<br>Zakładka chroniona hasłem<br><button id="unlockBtn">Odblokuj</button></div>`;
    $("#unlockBtn").onclick=()=>openSection(sec.id);return;
  }
  if(!ps.length){box.innerHTML=`<div class="empty">Brak stron. Kliknij ＋, aby dodać.</div>`;return;}
  ps.forEach(p=>{
    const d=document.createElement("div");
    d.className="item pitem"+(p.id===ui.page?" active":"");
    d.innerHTML=`<span class="name">${esc(p.title||"(bez tytułu)")}</span><small>${new Date(p.updated).toLocaleDateString("pl-PL",{day:"numeric",month:"short",year:"numeric"})}</small><button class="more" title="Opcje">⋯</button>`;
    d.onclick=()=>openPage(p.id);
    d.querySelector(".more").onclick=e=>{e.stopPropagation();pageMenu(p);};
    longPress(d,()=>pageMenu(p));
    box.append(d);
  });
}
function renderEditor(){
  const p=curPage();
  if(window.CSS&&CSS.highlights)CSS.highlights.delete("hit");
  $("#noPage").classList.toggle("hidden",!!p);
  $("#doc").classList.toggle("hidden",!p);
  $("#pageMore").classList.toggle("hidden",!p);
  if(!p)return;
  $("#title").value=p.title||"";
  $("#body").innerHTML=p.html||"";
  if(typeof histReset==="function")histReset(p);
  $("#meta").textContent="Zmieniono: "+new Date(p.updated).toLocaleString("pl-PL");
  $("#doc").scrollTop=0;
}
async function openSection(id){
  const sec=curNb().sections.find(s=>s.id===id);if(!sec)return;
  if(sec.enc&&!mem.unlocked[id]){if(!await unlock(sec))return;}
  if(ui.sec!==id){ui.sec=id;ui.page=(settings.lastPage||{})[id]||null;}
  render();setView("pages");save();
}
function openPage(id){ui.page=id;remember();renderPages();renderEditor();setView("editor");save();}

/* ---------- menu ---------- */
function secMenu(sec){
  const nb=curNb(),i=nb.sections.indexOf(sec),un=!!mem.unlocked[sec.id];
  const opts=[
    {label:"Zmień nazwę",fn:async()=>{const r=await form("Zmień nazwę zakładki",[{k:"n",label:"Nazwa",value:sec.name}]);if(r&&r.n.trim()){sec.name=r.n.trim();save();render();}}},
    {label:"Zmień kolor",fn:()=>menu("Kolor zakładki",COLORS.map(c=>({html:`<span class="sw" style="background:${c}"></span>`,fn:()=>{sec.color=c;save();render();}})),true)},
    {label:"⤒ Na samą górę listy",fn:()=>{nb.sections.splice(i,1);nb.sections.unshift(sec);save();render();revealActive();}},
    {label:"↑ Przesuń w górę",fn:()=>{move(nb.sections,i,-1);save();render();}},
    {label:"↓ Przesuń w dół",fn:()=>{move(nb.sections,i,1);save();render();}},
    {label:"⤓ Na sam dół listy",fn:()=>{nb.sections.splice(i,1);nb.sections.push(sec);save();render();revealActive();}}
  ];
  if(!sec.enc)opts.push({label:"🔒 Ustaw hasło",fn:()=>setPassword(sec)});
  else if(un)opts.push({label:"🔒 Zablokuj teraz",fn:()=>lockSec(sec)},{label:"Zmień hasło",fn:()=>setPassword(sec)},{label:"Usuń hasło",fn:()=>removePassword(sec)});
  else opts.push({label:"🔓 Odblokuj",fn:()=>openSection(sec.id)});
  opts.push({label:"Usuń zakładkę",danger:true,fn:()=>{
    if(!confirm("Usunąć zakładkę „"+sec.name+"” razem ze wszystkimi stronami? Tego nie da się cofnąć."))return;
    nb.sections.splice(nb.sections.indexOf(sec),1);delete mem.unlocked[sec.id];mem.dirtyEnc.delete(sec.id);dirtySecs.delete(sec.id);delSecs.add(sec.id);save();render();setView("sections");
  }});
  menu(sec.name,opts);
}
function pageMenu(pg){
  const sec=curSec(),ps=pagesOf(sec),p=pg||curPage();if(!p||!ps)return;const i=ps.indexOf(p);if(i<0)return;
  menu(p.title||"(bez tytułu)",[
    {label:"⤒ Na samą górę listy",fn:()=>{ps.splice(i,1);ps.unshift(p);touch(sec);renderPages();revealActive();}},
    {label:"↑ Przesuń w górę",fn:()=>{move(ps,i,-1);touch(sec);renderPages();}},
    {label:"↓ Przesuń w dół",fn:()=>{move(ps,i,1);touch(sec);renderPages();}},
    {label:"⤓ Na sam dół listy",fn:()=>{ps.splice(i,1);ps.push(p);touch(sec);renderPages();revealActive();}},
    {label:"➜ Przenieś do innej zakładki…",fn:()=>moveMenu(p,sec,false)},
    {label:"⧉ Kopiuj do innej zakładki…",fn:()=>moveMenu(p,sec,true)},
    {label:"Usuń stronę",danger:true,fn:()=>{if(!confirm("Usunąć stronę „"+(p.title||"bez tytułu")+"”? Tego nie da się cofnąć."))return;
      ps.splice(ps.indexOf(p),1);touch(sec);if(ui.page===p.id){ui.page=null;setView("pages");}render();}}
  ]);
}
function moveMenu(p,from,copy){
  const opts=[];
  for(const nb of state.notebooks)for(const s of nb.sections){
    if(s===from&&!copy)continue;const ps=pagesOf(s);if(!ps)continue;
    opts.push({html:`<span class="sw" style="background:${s.color}"></span>${esc(nb.name)} › ${esc(s.name)}`,fn:()=>{
      if(copy){
        const c=JSON.parse(JSON.stringify(p));c.id=uid();c.updated=Date.now();if(s===from)c.title=(c.title||"")+" (kopia)";
        ps.push(c);touch(s);render();toast("✓ Skopiowano do: "+s.name);
      }else{
        const src=pagesOf(from);src.splice(src.indexOf(p),1);ps.push(p);touch(from);touch(s);
        ui.nb=nb.id;ui.sec=s.id;ui.page=p.id;render();toast("✓ Przeniesiono do: "+s.name);
      }
    }});
  }
  if(!opts.length){alert("Brak innych dostępnych zakładek. Zablokowane trzeba najpierw odblokować.");return;}
  menu(copy?"Kopiuj do…":"Przenieś do…",opts);
}
async function newNb(){
  const r=await form("Nowy notes",[{k:"n",label:"Nazwa notesu"}]);
  if(!r||!r.n.trim()){renderNb();return;}
  const nb={id:uid(),name:r.n.trim(),sections:[]};state.notebooks.push(nb);ui.nb=nb.id;ui.sec=null;save();render();
}
function nbMenu(){
  const nb=curNb();
  menu(nb.name,[
    {label:"＋ Nowy notes",fn:newNb},
    {label:"Zmień nazwę notesu",fn:async()=>{const r=await form("Zmień nazwę notesu",[{k:"n",label:"Nazwa",value:nb.name}]);if(r&&r.n.trim()){nb.name=r.n.trim();save();render();}}},
    {label:"Usuń notes",danger:true,fn:()=>{
      if(state.notebooks.length<2){alert("To jedyny notes – nie można go usunąć.");return;}
      if(!confirm("Usunąć notes „"+nb.name+"” ze wszystkimi zakładkami i stronami? Tego nie da się cofnąć."))return;
      nb.sections.forEach(s=>{dirtySecs.delete(s.id);delSecs.add(s.id);});state.notebooks.splice(state.notebooks.indexOf(nb),1);ui.nb=null;save();render();
    }}
  ]);
}
function appMenu(){

const CHMAP={"ł":"l","ø":"o","æ":"a","ß":"s","đ":"d","œ":"o"};
const NCACHE=new Map();
function normChar(c){

}
const tcache=new Map();
const ENT={amp:"&",lt:"<",gt:">",quot:'"',apos:"'",nbsp:" "};

  return h.replace(/<(br|\/p|\/div|\/li|\/h\d|\/tr)\b[^>]*>/gi,"\n").replace(/<[^>]*>/g,"")
    .replace(/&(#x[0-9a-f]+|#\d+|[a-z]+);/gi,(m,e)=>{if(e[0]==="#"){const n=e[1]==="x"||e[1]==="X"?parseInt(e.slice(2),16):parseInt(e.slice(1),10);return isNaN(n)?m:String.fromCodePoint(n);}const v=ENT[e.toLowerCase()];return v===undefined?m:v;});
}
function entry(p){

function searchText(p){

function warmCache(){

  setTimeout(step,500);

function hl(text,terms){
  const nt=norm(text,settings.loose),r=[];

  r.sort((a,b)=>a[0]-b[0]);

  for(const [a,b] of r){
    if(b<=pos)continue;
    const s=Math.max(a,pos);out+=esc(text.slice(pos,s))+"<mark>"+esc(text.slice(s,b))+"</mark>";pos=b;
  }

}

  if(idx<0)idx=0;

  return (start>0?"…":"")+hl(flat.slice(start,end),terms)+(end<flat.length?"…":"");
}

function markEditor(terms){

function caretSet(off){

  const r=document.createRange();

  r.collapse(true);

}

function histCommit(){

  const p=curPage();if(!p||p.id!==hist.id)return;

  const b=body.textContent;
  // kursor tam, gdzie byla cofnieta/ponowiona zmiana
  let i=0;const m=Math.min(a.length,b.length);while(i<m&&a[i]===b[i])i++;
  let j=0;while(j<m-i&&a[a.length-1-j]===b[b.length-1-j])j++;

function selectStep(){

function imgToDataUrl(file){
  return new Promise((ok,bad)=>{
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{
      const MAX=1600,s=Math.min(1,MAX/Math.max(im.naturalWidth,im.naturalHeight));
      const w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s));
      const c=document.createElement("canvas");c.width=w;c.height=h;
      const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,w,h);g.drawImage(im,0,0,w,h);
      URL.revokeObjectURL(url);
      const png=c.toDataURL("image/png"),jpg=c.toDataURL("image/jpeg",0.85);
      ok(png.length<=jpg.length*1.3?png:jpg);
    };
    im.onerror=()=>{URL.revokeObjectURL(url);bad(new Error("nieobsługiwany format obrazka"));};
    im.src=url;
  });
}

async function syFetch(path,body){

    const used=new Set();
    const nbs=rm.notebooks.map(n=>({id:n.id,name:n.name,sections:n.sections.filter(s=>!syIsDel("sec:"+s.id)).map(s=>{
      used.add(s.id);const l=local.get(s.id);
      if(l){l.name=s.name;l.color=s.color;return l;}
      changed.add(s.id);return {id:s.id,name:s.name,color:s.color,enc:null,pages:[]};
    })}));
    if(sy.pend.meta!==undefined){ // zmiany po obu stronach: dolacz lokalne nowosci
      for(const n of state.notebooks){
        const keep=n.sections.filter(s=>!used.has(s.id)&&sy.pend["sec:"+s.id]!==undefined&&!syIsDel("sec:"+s.id));
        let t=nbs.find(x=>x.id===n.id);
        if(!t&&(keep.length||!n.sections.length)){t={id:n.id,name:n.name,sections:[]};nbs.push(t);}
        if(t)keep.forEach(s=>{t.sections.push(s);used.add(s.id);});
      }
    }
    for(const id of local.keys())if(!used.has(id)){removed.add(id);delete mem.unlocked[id];mem.dirtyEnc.delete(id);}
    state.notebooks=nbs.length?nbs:state.notebooks;
  }
  // 3) tresc zakladek
  for(const d of docs){
    if(!d.k.startsWith("sec:"))continue;
    const id=d.k.slice(4),s=findSec(id),mine=sy.pend[d.k]!==undefined&&!syIsDel(d.k);
    if(d.deleted){if(!mine&&s){syRemoveSec(id);removed.add(id);}continue;}
    if(!s)continue;
    const v=d.v||{};
    if(mine){
      const lp=pagesOf(s);
      if(!s.enc&&!v.enc&&lp){s.pages=mergePages(lp,v.pages||[]);}
      else if(JSON.stringify(secDoc(s))!==JSON.stringify(v)){ // zaszyfrowane: zachowaj obie wersje
        const nb=state.notebooks.find(n=>n.sections.includes(s));
        const c={id:uid(),name:s.name+" (wersja z innego urządzenia)",color:s.color,enc:v.enc||null,pages:v.enc?null:(v.pages||[])};
        nb.sections.splice(nb.sections.indexOf(s)+1,0,c);syMark("sec:"+c.id);syMark("meta");changed.add(c.id);
      }
      syMark(d.k);changed.add(id);
    }else{
      s.enc=v.enc||null;s.pages=v.enc?null:(v.pages||[]);delete mem.unlocked[id];mem.dirtyEnc.delete(id);changed.add(id);
    }
  }
  return {changed,removed};
}
async function syPersist(changed,removed){
  const puts=[["meta",metaOf()]],dels=[];
  for(const id of changed){const s=findSec(id);if(s)puts.push(["sec:"+id,secDoc(s)]);}
  for(const id of removed)if(!findSec(id))dels.push("sec:"+id);
  puts.push(["sync",sy]);
  await idbWrite(puts,dels);
}
function syUi(t,err){
  const b=$("#syncBtn");if(!b)return;
  b.classList.toggle("hidden",!syOn());b.classList.toggle("err",!!err);
  b.title="Synchronizacja z serwerem: "+t;
}
async function syncNow(manual){
  if(!syOn()){if(manual)syncSettings();return;}
  if(syBusy)return;syBusy=true;syUi("trwa…");$("#syncBtn").classList.add("spin");
  try{
    await doSave();
    const first=!sy.seq&&!Object.keys(sy.revs).length;
    let pulled=await syPullAll(sy.seq);
    let docs=pulled.docs.filter(d=>(sy.revs[d.k]||0)<d.rev);
    if(first&&docs.length){
      const rep=confirm("Na serwerze są już notatki z innego urządzenia.\n\nOK = ZASTĄP notatki na tym urządzeniu wersją z serwera (zalecane, gdy to drugie urządzenie).\nAnuluj = POŁĄCZ notatki z obu miejsc.");
      if(rep){
        const metaD=docs.find(d=>d.k==="meta");if(!metaD)throw new Error("niepełne dane na serwerze");
        const secs=new Map(docs.filter(d=>d.k.startsWith("sec:")&&!d.deleted).map(d=>[d.k.slice(4),d.v]));
        state={version:2,notebooks:metaD.v.notebooks.map(n=>({id:n.id,name:n.name,sections:n.sections.map(s=>{const v=secs.get(s.id)||{};return {id:s.id,name:s.name,color:s.color,enc:v.enc||null,pages:v.enc?null:(v.pages||[])};})}))};
        mem={unlocked:{},dirtyEnc:new Set()};sy.pend={};
        await idbClear();
        for(const d of docs)sy.revs[d.k]=d.rev;
        sy.seq=pulled.seq;sy.lastMeta=JSON.stringify(syncMetaOf());
        dirtySecs.clear();delSecs.clear();markAllDirty();
        await (async()=>{const puts=[["meta",metaOf()],["sync",sy]];state.notebooks.forEach(n=>n.sections.forEach(s=>puts.push(["sec:"+s.id,secDoc(s)])));await idbWrite(puts,[]);})();
        dirtySecs.clear();
        fixUi();render();warmCache();
        sy.last=Date.now();syUi("zsynchronizowano "+new Date().toLocaleTimeString("pl-PL"));toast("✓ Notatki pobrane z serwera");return;
      }
      syMarkAll();
    }else if(first){syMarkAll();}
    for(let round=0;round<4;round++){
      if(docs.length){
        const {changed,removed}=syApply(docs);
        for(const d of docs)sy.revs[d.k]=d.rev;
        fixUi();await syPersist(changed,removed);render();
      }
      sy.seq=Math.max(sy.seq,pulled.seq||0);
      // wysylka lokalnych zmian (w paczkach)
      const keys=Object.keys(sy.pend);if(!keys.length)break;
      const conf=[];let batch=[],size=0,snap={};
      const flush=async()=>{
        if(!batch.length)return;
        let r,err;
        for(let t=0;t<3;t++){try{r=await syFetch("push",{docs:batch});break;}catch(e){err=e;await new Promise(z=>setTimeout(z,1500*(t+1)));}}
        if(!r)throw err;
        for(const o of r.ok){sy.revs[o.k]=o.rev;if(sy.pend[o.k]===snap[o.k])delete sy.pend[o.k];}
        conf.push(...r.conflicts);batch=[];size=0;
      };
      for(const k of keys){
        snap[k]=sy.pend[k];let d;
        if(syIsDel(k))d={k,base:sy.revs[k]||0,deleted:true};
        else if(k==="meta")d={k,base:sy.revs[k]||0,v:syncMetaOf()};
        else{const s=findSec(k.slice(4));if(!s){delete sy.pend[k];continue;}d={k,base:sy.revs[k]||0,v:secDoc(s)};}
        const n=JSON.stringify(d).length;if(size+n>1.5e6)await flush();batch.push(d);size+=n;
      }
      await flush();
      sy.lastMeta=JSON.stringify(syncMetaOf());
      await idbWrite([["sync",sy]],[]);
      if(!conf.length)break;
      docs=conf.map(c=>({k:c.k,rev:c.rev,deleted:c.deleted,v:c.v}));pulled={seq:0};
    }
    sy.last=Date.now();await idbWrite([["sync",sy]],[]);
    syUi("zsynchronizowano "+new Date().toLocaleTimeString("pl-PL"));syErr="";
    if(manual)toast("✓ Zsynchronizowano z serwerem");
  }catch(e){
    syErr=e.message;syUi("błąd – "+e.message,true);
    if(manual)alert("Synchronizacja nie powiodła się: "+e.message);
  }finally{syBusy=false;const b=$("#syncBtn");if(b)b.classList.remove("spin");}
}
async function syncTest(){
  const base=settings.sync&&settings.sync.url?settings.sync.url.replace(/\/+$/,""):"";
  if(!base){alert("Najpierw ustaw adres serwera.");return;}
  const out=[];const t=async(label,fn)=>{const t0=Date.now();try{out.push("✓ "+label+": "+(await fn())+" ("+(Date.now()-t0)+" ms)");}catch(e){out.push("✗ "+label+": "+(e.name||"")+" "+e.message+" ("+(Date.now()-t0)+" ms)");}};
  out.push("Internet w telefonie: "+(navigator.onLine?"tak":"NIE"));
  await t("serwer w ogóle osiągalny",async()=>{await fetch(base+"/api/notatnik/ping",{mode:"no-cors",cache:"no-store"});return "tak";});
  await t("odpowiedź z kluczem",async()=>{const r=await fetch(base+"/api/notatnik/ping?k="+encodeURIComponent(settings.sync.key||""),{cache:"no-store"});return r.status+" "+(await r.text()).slice(0,60);});
  await t("pobieranie listy zmian",async()=>{const r=await fetch(base+"/api/notatnik/pull?since=999999999&k="+encodeURIComponent(settings.sync.key||""),{cache:"no-store"});return r.status;});
  await t("wysyłanie (pusta paczka)",async()=>{const r=await fetch(base+"/api/notatnik/push?k="+encodeURIComponent(settings.sync.key||""),{method:"POST",headers:{"Content-Type":"text/plain;charset=UTF-8"},body:'{"docs":[]}',cache:"no-store"});return r.status;});
  out.push("Ostatni błąd synchronizacji: "+(syErr||"brak"));
  alert("Test połączenia z serwerem\n\n"+out.join("\n"));
}
async function syncSettings(){
  const s=settings.sync||{};
  const r=await form("Synchronizacja z serwerem domowym",[
    {k:"url",label:"Adres serwera",value:s.url||"https://serwer.tail51ec1c.ts.net"},
    {k:"key",label:"Klucz synchronizacji (z pliku S:\\klucz-synchronizacji.txt)",value:s.key||""}],
    "Działa, gdy na tym urządzeniu jest włączony Tailscale. Notatki zostają też na urządzeniu, więc bez połączenia wszystko działa normalnie, a zsynchronizuje się później. Pozostaw klucz pusty, aby wyłączyć synchronizację.");
  if(!r)return;
  const key=r.key.trim(),url=r.url.trim();
  settings.sync={url,key,on:!!(url&&key)};saveSettings();syUi("…");
  if(settings.sync.on)syncNow(true);
}
setInterval(()=>{if(document.visibilityState==="visible"&&syOn())syncNow(false);},120000);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&syOn()&&Date.now()-sy.last>30000)syncNow(false);});

/* ---------- start ---------- */
applyTheme();applyFocus();applyFs();setStatus("Wczytywanie…");
load().then(()=>{$("#syncBtn").onclick=()=>syncNow(true);syUi(sy.last?"ostatnio "+new Date(sy.last).toLocaleString("pl-PL"):"jeszcze nie było");if(syOn())setTimeout(()=>syncNow(false),1500);render();warmCache();setView(curPage()?"editor":(curSec()?"pages":"sections"));setTimeout(revealActive,60);setStatus("");
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
}).catch(e=>{alert("Błąd wczytywania notatek: "+e.message);});
</script>
